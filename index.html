<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Łabiszyńska Liga Orlikowa</title>
    <style>
        body { font-family: Arial; background-color: #3399ff; color: #000; padding: 20px; }
        h1, h2 { color: #000; }
        table { width: 100%; border-collapse: collapse; background-color: #e6f2ff; margin-bottom: 30px; }
        th, td { border: 1px solid #000; padding: 8px; text-align: center; }
        tr:nth-child(even) { background-color: #cce0ff; }
        tr:nth-child(odd) { background-color: #b3d1ff; }
    </style>
</head>
<body>
    <h1>Łabiszyńska Liga Orlikowa - Tabela</h1>
    <table id="league-table">
        <thead>
            <tr>
                <th>#</th><th>Drużyna</th><th>Mecze</th><th>Punkty</th>
                <th>Zwycięstwa</th><th>Remisy</th><th>Porażki</th>
                <th>Bramki zdobyte</th><th>Bramki stracone</th><th>Bilans</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Wyniki spotkań</h2>
    <table id="schedule-table">
        <thead>
            <tr><th>Gospodarz</th><th>Gość</th><th>Wynik</th></tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
